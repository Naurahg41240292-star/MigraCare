name: migracare
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.1.2
  url_launcher: ^6.2.0

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  tflite_flutter: ^0.12.1
  firebase_core: ^4.15.0
  cloud_firestore: ^6.10.0
  firebase_auth: ^6.7.0
  google_sign_in: 6.2.1
  google_fonts: ^6.3.3
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  firebase_messaging: ^16.7.0
  firebase_storage: ^13.6.0
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:

  uses-material-design: true

  assets:
    - assets/images/


  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list contains a
  # "family" key with a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# ✅ Konfigurasi ikon launcher — di ROOT level (sejajar dependencies & flutter)
flutter_launcher_icons:
  image_path: "assets/images/launcher_logo.png"
  android: true
  ios: true
  adaptive_icon_background: "#FAF4EA"
  adaptive_icon_foreground: "assets/images/launcher_logo.png"

  remove_alpha_ios: true


